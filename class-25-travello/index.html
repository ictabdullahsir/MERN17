<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Page</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      width: min(420px, 90vw);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    p.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
    .count { font-size: 3rem; text-align: center; margin: 1rem 0; color: var(--accent); }
    .row { display: flex; gap: .5rem; }
    button {
      flex: 1;
      padding: .6rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0f172a;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--muted); }
    button:hover { opacity: .9; }
    form { margin-top: 1.5rem; display: flex; gap: .5rem; }
    input {
      flex: 1;
      padding: .6rem;
      border-radius: 8px;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--text);
    }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; }
    li {
      padding: .5rem .75rem;
      background: rgba(255,255,255,.05);
      border-radius: 6px;
      margin-bottom: .4rem;
      display: flex;
      justify-content: space-between;
    }
    li span.del { color: #f87171; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Demo Page</h1>
    <p class="sub">A simple static HTML + CSS + JS demo.</p>

    <div class="count" id="count">0</div>
    <div class="row">
      <button id="inc">+1</button>
      <button id="dec" class="ghost">-1</button>
      <button id="reset" class="ghost">Reset</button>
    </div>

    <form id="form">
      <input id="item" type="text" placeholder="Add an item..." required />
      <button type="submit" style="flex:0 0 auto;">Add</button>
    </form>
    <ul id="list"></ul>
  </div>

  <script>
    const countEl = document.getElementById('count');
    let count = 0;
    const render = () => (countEl.textContent = count);

    document.getElementById('inc').onclick = () => { count++; render(); };
    document.getElementById('dec').onclick = () => { count--; render(); };
    document.getElementById('reset').onclick = () => { count = 0; render(); };

    const list = document.getElementById('list');
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('item');
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.textContent = text;

      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = () => li.remove();

      li.appendChild(del);
      list.appendChild(li);
      input.value = '';
    });
  </script>
</body>
</html>
